; Réglages PHP de l'image (s'ajoutent à ceux de l'image officielle).
expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 21M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; 1 : le code monté depuis l'hôte (développement) est relu à chaque modification. En production
; (code copié dans l'image, jamais modifié), mettez 0 et redémarrez le conteneur à chaque déploiement.
opcache.validate_timestamps = 1
