server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 21M;
    server_tokens off;

    # Fichiers cachés (.env, .git...) : jamais servis, même s'ils se retrouvaient dans public/.
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Seul le point d'entrée est exécuté : un .php déposé ailleurs dans public/ (upload mal rangé)
    # n'est jamais interprété.
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }

    location ~ \.php$ {
        return 404;
    }
}
