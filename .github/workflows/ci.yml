name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-progress

      - name: Syntaxe de preload.php (opcache.preload, non exécutable en CI)
        run: php -l preload.php

      - name: Style de code (PSR-12)
        run: composer lint

      - name: Analyse statique (PHPStan)
        run: composer analyse

      - name: Tests
        run: composer test

  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Une seule version PHP ici (la matrice ci-dessus couvre déjà 8.1 à 8.4, mais uniquement
        # sur Linux) : ce job vérifie que le framework tourne réellement sur Windows et macOS,
        # pas seulement que rien dans le code n'y fait explicitement obstacle.
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # fileinfo : lecture du vrai type MIME des fichiers envoyés (UploadedFile). Absente du
          # php.ini par défaut sous Windows ; sans elle, les règles image/mimes refusent tout.
          extensions: pdo_sqlite, fileinfo
          coverage: none

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-progress

      - name: Style de code (PSR-12)
        run: composer lint

      - name: Analyse statique (PHPStan)
        run: composer analyse

      - name: Tests
        run: composer test

  mysql:
    name: Migrations — MySQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: niangpro_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-progress

      - name: Migrations et contraintes (base réelle, pas :memory:)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: niangpro_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: ./vendor/bin/phpunit --testsuite=Database

  postgres:
    name: Migrations — PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niangpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-progress

      - name: Migrations et contraintes (base réelle, pas :memory:)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: niangpro_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: ./vendor/bin/phpunit --testsuite=Database

  coverage:
    name: Couverture de code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: pcov
          # Sans ça, pcov ne mesure qu'un dossier (src/) : app/ apparaîtrait à 0 % bien que testé.
          ini-values: pcov.directory=., pcov.exclude="~/vendor/~"

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-progress

      - name: Tests avec mesure de couverture
        run: ./vendor/bin/phpunit --coverage-clover build/clover.xml --coverage-text

      - name: Seuils (global et composants critiques, voir tools/coverage-check.php)
        run: php tools/coverage-check.php build/clover.xml

      - name: Rapport Clover
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-clover
          path: build/clover.xml
          if-no-files-found: ignore

  docker:
    name: Docker (compose.yaml)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construire et démarrer PHP-FPM, Nginx et MySQL
        run: docker compose up -d --build --wait

      # Premier démarrage : le conteneur installe vendor/, crée .env et sa clé, puis migre.
      - name: Attendre que l'application réponde (jusqu'à 180 s)
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/up > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs app web
          exit 1

      - name: Vérifier les réponses HTTP
        run: |
          set -e
          curl -fsS http://localhost:8080/ > /dev/null
          curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q '"database":"ok"'
          # Fichier statique servi par Nginx, sans passer par PHP.
          curl -fsS -o /dev/null http://localhost:8080/favicon.svg
          # Jamais de fichier caché ni de .php hors du point d'entrée.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/.env)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/autre.php)" = 404
          # Les variables de Docker arrivent bien à PHP-FPM (clear_env = no) : un article inséré
          # directement dans MySQL est renvoyé par l'API, via Nginx et PHP-FPM. Sans ça, FPM lirait
          # DB_CONNECTION=sqlite dans .env et ne le trouverait pas.
          docker compose exec -T db mysql -uniangpro -pniangpro niangpro \
            -e "INSERT INTO posts (title, body) VALUES ('marqueur-docker-ci', 'x')"
          curl -fsS http://localhost:8080/api/posts | grep -q marqueur-docker-ci
          # La clé générée au premier démarrage n'est pas remplacée au redémarrage.
          before=$(grep '^APP_KEY=' .env)
          docker compose restart app
          sleep 5
          test "$before" = "$(grep '^APP_KEY=' .env)"
          test -n "${before#APP_KEY=}"

      - name: Suite Database dans le conteneur, contre MySQL
        run: docker compose exec -T -e DB_DATABASE=niangpro_test app vendor/bin/phpunit --testsuite=Database

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêter
        if: always()
        run: docker compose down -v

  s3:
    name: Stockage S3 (moto)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-progress

      # Serveur compatible S3 local. Il accepte toute signature : la signature SigV4 est vérifiée à part,
      # contre les exemples publiés par AWS (tests/Unit/Storage/SigV4Test.php).
      - name: Démarrer moto et créer le bucket
        run: |
          pip install "moto[server]" boto3
          moto_server -p 5055 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:5055/ > /dev/null && break; sleep 1; done
          python -c "import boto3; boto3.client('s3', endpoint_url='http://127.0.0.1:5055', aws_access_key_id='test', aws_secret_access_key='test', region_name='us-east-1').create_bucket(Bucket='niangpro-test')"

      - name: Tests du disque s3
        env:
          NP_S3_ENDPOINT: http://127.0.0.1:5055
          NP_S3_BUCKET: niangpro-test
        run: ./vendor/bin/phpunit tests/Unit/Storage

  packaging-smoke:
    name: Packaging — ${{ matrix.site_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Une route stable propre à chaque thème, en plus de /, /up et /health communes à tous.
          - site_type: minimal
            page: /contact
          - site_type: vitrine
            page: /a-propos
          - site_type: ecommerce
            page: /boutique
          - site_type: blog
            page: /blog
          - site_type: portfolio
            page: /projets
          - site_type: landing
            page: /mentions-legales

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      # Simule l'expérience réelle d'installation (composer create-project niangpro/framework),
      # mais à partir du commit courant plutôt que de Packagist : dépôt Composer de type "path",
      # copie réelle du répertoire (symlink:false) plutôt qu'un lien qui masquerait des soucis de
      # packaging. "dev-main --stability=dev" est nécessaire : un paquet "path" n'a pas de version
      # stable tant qu'il n'est pas tagué, incompatible avec le "minimum-stability: stable" du
      # projet sans ces deux options. "versions" force cette version : sur une pull request, le
      # checkout est un HEAD détaché sans branche main, et Composer ne la devinerait pas.
      - name: composer create-project depuis le commit courant (pas Packagist)
        env:
          NIANG_SITE_TYPE: ${{ matrix.site_type }}
        run: >
          composer create-project
          --repository '{"type":"path","url":".","options":{"symlink":false,"versions":{"niangpro/framework":"dev-main"}}}'
          niangpro/framework /tmp/niang-demo dev-main
          --no-interaction --prefer-dist --no-dev

      # Ni .env ni storage/ n'existent dans un checkout propre (tous deux hors du dépôt) : le
      # projet créé doit fonctionner tel quel, sans étape manuelle — voir le README, qui ne
      # documente aucun `cp .env.example .env` pour ce chemin d'installation. Le .env est créé par
      # ComposerHooks avec une APP_KEY propre au projet (sans elle, les URLs signées et les cookies
      # chiffrés refusent de fonctionner). storage/ n'est plus vérifié ici : un thème avec une étape
      # "setup" (boutique, blog : migrate + db:seed) le crée légitimement pendant l'installation.
      - name: Le projet créé a un .env avec sa propre APP_KEY
        run: grep -Eq '^APP_KEY=[0-9a-f]{64}$' /tmp/niang-demo/.env

      # Idempotent et sans effet néfaste même pour un thème qui n'en a pas besoin (db:seed
      # affiche juste "Seeder introuvable" et sort en succès) : suit le même chemin que les
      # instructions affichées à l'utilisateur après l'installation (ProjectScaffolder::nextSteps()).
      - name: Migrer et alimenter la base
        working-directory: /tmp/niang-demo
        run: |
          ./bin/niang migrate
          ./bin/niang db:seed

      - name: Démarrer le serveur intégré
        working-directory: /tmp/niang-demo
        run: |
          php -S 127.0.0.1:8000 -t public > /tmp/niang-demo-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/up > /dev/null 2>&1 && exit 0
            sleep 0.5
          done
          echo "::error::Le serveur n'a jamais répondu."
          cat /tmp/niang-demo-server.log
          exit 1

      - name: Vérifier /, /up, /health et la page propre au thème (200 attendu)
        run: |
          status=0
          for path in / /up /health "${{ matrix.page }}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$path a répondu $code (200 attendu)"
              status=1
            fi
          done
          if [ "$status" != "0" ]; then
            cat /tmp/niang-demo-server.log
            exit 1
          fi

      - name: Arrêter le serveur
        if: always()
        run: pkill -f "php -S 127.0.0.1:8000" || true
