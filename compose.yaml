# Environnement Docker de développement : PHP-FPM + Nginx + MySQL.
#
#   docker compose up -d        puis  http://localhost:8080
#   docker compose exec app php bin/niang db:seed
#
# Le code est monté depuis ce dossier : une modification est visible sans reconstruire l'image.
# Docker reste facultatif — `./bin/niang serve` avec SQLite suffit pour développer.
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: niangpro
      DB_USERNAME: niangpro
      DB_PASSWORD: niangpro
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${NIANGPRO_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: niangpro
      MYSQL_USER: niangpro
      MYSQL_PASSWORD: niangpro
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
